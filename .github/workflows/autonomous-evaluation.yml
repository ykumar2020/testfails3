name: Autonomous evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: testfails3-autonomous-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TESTFAILS_OPENAI_MODEL: ${{ vars.TESTFAILS_OPENAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TESTFAILS_GEMINI_MODEL: ${{ vars.TESTFAILS_GEMINI_MODEL }}
      TESTFAILS_COMPAT_API_KEY: ${{ secrets.TESTFAILS_COMPAT_API_KEY }}
      TESTFAILS_COMPAT_BASE_URL: ${{ vars.TESTFAILS_COMPAT_BASE_URL }}
      TESTFAILS_COMPAT_MODEL: ${{ vars.TESTFAILS_COMPAT_MODEL }}
      TESTFAILS_COMPAT_NAME: ${{ vars.TESTFAILS_COMPAT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Verify implementation
        run: python -m pytest -q
      - name: Synchronize official Arena datasets
        run: python -m testfails.cli sync-arena
      - name: Run configured model APIs
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" || -n "$GEMINI_API_KEY" || -n "$TESTFAILS_COMPAT_API_KEY" ]]; then
            python -m testfails.cli evaluate
          else
            echo "No provider secrets configured; Arena synchronization completed without fabricating a model run."
          fi
      - name: Commit new evidence
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/)" ]]; then
            git config user.name "testFAILS3 autonomous runner"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "data: refresh autonomous evidence [skip ci]"
            git push
          else
            echo "Evidence is unchanged."
          fi
